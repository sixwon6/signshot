<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The `/collect/*` policy from `site/public/_headers` minus `frame-ancestors`, which CSP3
      ignores in a <meta>. `scripts/check-site.ts` asserts the two copies match and that the one
      script hash is the script below.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-egJvXt1btdP6enz/y1WzhQopgbniaOsQWWfcQy4VNQM='; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f2efe6" />
    <title>Signshot</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/brand/era-shot.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Signshot home"
        ><img src="/brand/era-shot-mark.svg" width="36" height="36" alt="" />Signshot</a
      >
    </header>
    <main class="document">
      <a id="open" class="button primary" hidden>Open in Signshot</a>
    </main>
    <script>
      // `collectUrl()`'s link rebuilt from checked values (one 32-byte address; devnet or no
      // cluster) as an Android intent for the app's package. Anything else shows no control.
      const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      const isAddress = (text) => {
        if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(text)) return false;
        let n = 0n, bytes = /^1*/.exec(text)[0].length;
        for (const c of text) n = n * 58n + BigInt(B58.indexOf(c));
        for (; n > 0n; n >>= 8n) bytes += 1;
        return bytes === 32;
      };
      const query = new URLSearchParams(location.search);
      const core = query.getAll("core"), cluster = query.getAll("cluster");
      if (core.length === 1 && isAddress(core[0]) && (cluster.length === 0 || (cluster.length === 1 && cluster[0] === "devnet"))) {
        const open = document.getElementById("open");
        open.href = "intent://erashot.app/collect/?core=" + core[0] + (cluster.length ? "&cluster=devnet" : "") +
          "#Intent;scheme=https;package=app.seekershot;S.browser_fallback_url=https%3A%2F%2Ferashot.app%2F;end";
        open.hidden = false;
      }
    </script>
  </body>
</html>
