[package]
name = "svm-host"
version = "0.1.0"
edition = "2021"
publish = false

# LiteSVM in a process of its own, driven line by line over stdin/stdout by
# `scripts/check-program-svm.ts` (`npm run test:svm`). The `litesvm` npm package ships no Windows
# binary, so the suite reaches the same Rust crate this way. Host-only test tooling: nothing here
# is part of the program or its Cargo.lock.

[dependencies]
litesvm = "=0.16.0"
serde_json = "1"
solana-account = "4.3.0"
solana-address = "2.6.1"
solana-instruction-error = "2.4.0"
solana-rent = "4.3.0"
solana-transaction = { version = "4.1.5", features = ["wincode"] }
solana-transaction-error = "3.3.1"
wincode = "0.5.5"
