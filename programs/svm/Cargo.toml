[package]
name = "svm-host"
version = "0.1.0"
edition = "2021"
publish = false

# LiteSVM as a child process driven over stdin/stdout (one JSON line per call) by
# scripts/check-candy-svm.ts. The `litesvm` npm package ships no Windows binary. Test tooling only.

[dependencies]
litesvm = "=0.16.0"
serde_json = "1"
solana-account = "4.3.0"
solana-address = "2.6.1"
solana-instruction-error = "2.4.0"
solana-rent = "4.3.0"
solana-transaction = { version = "4.1.5", features = ["wincode"] }
solana-transaction-error = "3.3.1"
wincode = "0.5.5"
