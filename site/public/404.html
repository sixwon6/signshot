<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10140f" />
    <!--
      Without a top-level 404.html, Cloudflare Pages answers every unknown path with index.html
      and a 200. This file makes a missing path a 404, so a wallet fetching an unpublished
      /.well-known/assetlinks.json sees "not found", not the home page labelled as JSON.

      The policy below is the static-page policy in site/public/_headers minus frame-ancestors
      (ignored in a <meta>), repeated because this body is served for arbitrary paths and
      _headers matches the request path, not this file's.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>Not found</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/brand/era-shot.css" />
  </head>
  <body>
    <main class="document">
      <h1>Not found</h1>
    </main>
  </body>
</html>
