apply plugin: 'com.android.library'

group = 'expo.modules.seekercamera'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

android {
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  namespace "expo.modules.seekercamera"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // QR scanning (QrScanner.kt). Bundled ML Kit model: works without Play services (~2.4 MB).
  // https://developers.google.com/ml-kit/vision/barcode-scanning/android
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'

  // CameraX: the scanner's preview and frame analysis.
  implementation 'androidx.camera:camera-core:1.6.2'
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'

  // AppCompatActivity is the LifecycleOwner bindToLifecycle needs. Pinned to React Native 0.86's
  // own appcompat (react-native/gradle/libs.versions.toml) so the resolved version cannot move.
  implementation 'androidx.appcompat:appcompat:1.7.0'

  androidTestImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
