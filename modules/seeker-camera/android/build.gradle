apply plugin: 'com.android.library'

group = 'expo.modules.seekercamera'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

android {
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  namespace "expo.modules.seekercamera"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
    versionCode 1
    versionName "0.1.0"
    // Instrumented tests only; does not affect the shipped APK.
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // QR scanning (QrScanner.kt), on exact pinned versions.

  // The BUNDLED ML Kit barcode model: decodes with no Google Play services on the device, which is
  // why this route was taken over play-services-code-scanner. About 2.4 MB of APK.
  // https://developers.google.com/ml-kit/vision/barcode-scanning/android
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'

  // CameraX drives the scanner's preview and per-frame analysis.
  implementation 'androidx.camera:camera-core:1.6.2'
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'

  // QrScannerActivity is an AppCompatActivity (a LifecycleOwner, which bindToLifecycle needs).
  // Pinned to the version React Native 0.86 itself resolves — `androidx-appcompat = "1.7.0"` in
  // node_modules/react-native/gradle/libs.versions.toml — so this adds nothing to the APK and
  // cannot move the app's resolved appcompat.
  implementation 'androidx.appcompat:appcompat:1.7.0'

  androidTestImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
