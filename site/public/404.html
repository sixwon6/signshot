<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10140f" />
    <!--
      Without a 404.html, Pages serves index.html with a 200 for unknown paths (including an
      unpublished /.well-known/assetlinks.json). The CSP repeats _headers' static policy minus
      frame-ancestors, because _headers matches the request path, not this file.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>Not found</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/brand/signshot.css" />
  </head>
  <body>
    <main class="document">
      <h1>Not found</h1>
    </main>
  </body>
</html>
